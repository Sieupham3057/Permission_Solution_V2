version: '3.8'

services:
  sql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql2022
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "123456a@"
      ACCEPT_EULA: "Y"

  permissionapi:
    image: trandongdocker/permission.api:latest
    ports:
      - "9000:8080"
    depends_on:
      - sql2022
    environment:
      ConnectionStrings__ConnectionStrings: "Data Source=sql2022,1433;Initial Catalog=PermissionDB;User Id=sa;Password=123456a@;TrustServerCertificate=True"
